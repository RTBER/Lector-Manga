    </section>

    <section id="reader" class="reader" aria-label="Lector" hidden>
      <div class="toolbar">
        <h1 id="chapter-title"></h1>
        <div class="toolbar-controls">
          <label><span>Lectura</span>
            <select id="direction" aria-label="Dirección de lectura">
              <option value="rtl">Derecha a izquierda</option>
              <option value="ltr">Izquierda a derecha</option>
            </select>
          </label>
          <label><span>Zoom</span>
            <select id="zoom" aria-label="Zoom de página">
              <option value="fit">Encajar</option>
              <option value="width">Ancho</option>
              <option value="50">50 %</option>
              <option value="75">75 %</option>
              <option value="90">90 %</option>
              <option value="100">100 %</option>
              <option value="125">125 %</option>
              <option value="150">150 %</option>
              <option value="200">200 %</option>
            </select>
          </label>
          <button type="button" id="fullscreen" class="secondary" aria-keyshortcuts="F" title="Pulsa Esc, F o toca el centro para salir">Pantalla completa</button>
        </div>
      </div>
      <div id="stage" class="stage" tabindex="0" aria-label="Página del manga">
        <div class="page-wrap"><img id="page-image" alt="" draggable="false" hidden></div>
        <p id="page-message" class="page-message" role="status" hidden></p>
      </div>
      <footer class="navigation">
        <div class="paging" id="paging" data-direction="rtl">
          <button type="button" id="previous" class="secondary" aria-keyshortcuts="PageUp">Anterior</button>
          <button type="button" id="next" class="primary" aria-keyshortcuts="PageDown">Siguiente</button>
        </div>
        <input type="range" id="progress" min="1" max="1" value="1" aria-label="Ir a una página">
        <form id="jump">
          <label for="page-number">Página</label>
          <input type="number" id="page-number" min="1" max="1" value="1" required>
          <span id="page-count"></span>
        </form>
      </footer>
    </section>
  </main>
  <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
  <div id="drop-overlay" class="drop-overlay" hidden>Suelta el archivo para abrirlo</div>
</body>
</html>
